[project]
name = "prompt-scout"
version = "0.1.0"
description = "MCP server for semantic search over 15k+ Nano Banana image prompts: search by idea or by example photo, then adapt a prompt for selfie-based generation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "google-genai>=1.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pillow>=10",
    "certifi>=2024.2.2",
    # cryptography 49+ ships no wheels for Intel Macs; 48.0.1 is the last one that installs without Rust
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prompt-scout = "prompt_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
